# Fly.io: one always-on machine with a persistent volume at /data.
#   fly launch --copy-config --no-deploy      # creates the app; pick a region
#   fly volumes create data --size 1          # same region as the app
#   fly secrets set APP_PASSWORD='choose-a-long-password'   # plus X_* keys if you publish via the API
#   fly deploy
# Then open https://<app>.fly.dev (any username, that password).
app = "o-typefully"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # The scheduler runs inside the process: the machine must never be stopped,
  # or nothing is published and no reminder fires at slot time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"   # no password, no Host check

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
